name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lienstore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe /api/health/
        run: |
          docker run -d --name lienstore -p 3000:3000 -e ADMIN_PASSWORD=ci-secret -e ADMIN_SESSION_SECRET=ci-secret lienstore:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs lienstore; exit 1
