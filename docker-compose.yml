# Local/production compose for LienStore.
#   docker compose up -d --build                                   # build + run locally
#   IMAGE=ghcr.io/<owner>/lienstore:1.1.0 docker compose up -d     # run a published image
services:
  app:
    image: ${IMAGE:-lienstore:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lienstore
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LIEN_DB_PATH: /app/data/lienstore.db
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file:
      - path: .env.local
        required: false
    volumes:
      # SQLite database (orders, customers, product edits). Back this folder up.
      - lienstore-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lienstore-data:
